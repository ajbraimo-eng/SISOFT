<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Painel Sisoft" />
    <title>Painel — Sisoft</title>
    <meta name="application-name" content="Sisoft" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body class="app-body">
    <header class="app-top">
      <a class="brand" href="/app.html" aria-label="Sisoft">
        <img src="/assets/logo.svg" alt="Sisoft" width="30" height="30" />
        <span>Sisoft</span>
      </a>
      <div class="app-user">
        <span id="user-label">—</span>
        <button class="btn btn-ghost" type="button" id="logout-btn">Sair</button>
      </div>
    </header>

    <div class="app-layout">
      <nav class="app-nav" aria-label="Módulos">
        <a href="#resumo" class="is-active" data-view="resumo">Resumo</a>
        <a href="#stock" data-view="stock">Stock</a>
        <a href="#obras" data-view="obras">Obras</a>
        <a href="#clientes" data-view="clientes">Clientes</a>
        <a href="#facturas" data-view="facturas">Facturas</a>
        <a href="#cotacoes" data-view="cotacoes">Cotações</a>
      </nav>

      <main class="app-main" id="app-main">
        <h1 id="view-title">Resumo</h1>
        <p class="lead" id="view-lead">Visão geral da operação.</p>
        <div id="view-content"></div>
      </main>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
