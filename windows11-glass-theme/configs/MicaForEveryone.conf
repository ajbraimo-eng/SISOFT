# Glass Dock — MicaForEveryone
# Importe ou copie regras equivalentes na UI do MicaForEveryone.
# Documentação: https://github.com/MicaForEveryone/MicaForEveryone

[Global]
TitleBarColor=Default
BackdropType=Acrylic
ExtendFrameIntoClientArea=true
CornerPreference=Round

[Process:explorer]
TitleBarColor=Light
BackdropType=Acrylic
ExtendFrameIntoClientArea=true
CornerPreference=Round

[Class:CabinetWClass]
TitleBarColor=Light
BackdropType=Acrylic
ExtendFrameIntoClientArea=true
CornerPreference=Round

[Class:XamlExplorerHostIslandWindow]
TitleBarColor=Light
BackdropType=Mica
ExtendFrameIntoClientArea=true
CornerPreference=Round

