[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=GlassDock Search
Author=Glass Dock
Information=Barra de pesquisa flutuante no topo (estilo mockup glass)
Version=1.0
License=CC BY-NC-SA 4.0

[Variables]
BarWidth=420
BarHeight=44
Accent=70,140,220
TextColor=90,110,140
BgColor=255,255,255,210
BorderColor=255,255,255,255

; ===== Background glass pill =====
[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,#BarWidth#,#BarHeight#,22,22 | Fill Color #BgColor# | StrokeWidth 1.5 | Stroke Color #BorderColor#
AntiAlias=1
X=0
Y=0

; Soft shadow via second shape underneath (subtle)
[MeterShadow]
Meter=Shape
Shape=Rectangle 2,4,#BarWidth#,#BarHeight#,22,22 | Fill Color 100,140,180,35 | StrokeWidth 0
AntiAlias=1
X=0
Y=0

[MeterBgFront]
Meter=Shape
Shape=Rectangle 0,0,#BarWidth#,#BarHeight#,22,22 | Fill Color #BgColor# | StrokeWidth 1.2 | Stroke Color 255,255,255,230
AntiAlias=1
X=0
Y=0

; ===== Search icon =====
[MeterIconCircle]
Meter=Shape
Shape=Ellipse 28,22,9,9 | Fill Color 0,0,0,0 | StrokeWidth 2.2 | Stroke Color #Accent#
Shape2=Line 34.5,28.5,40,34 | StrokeWidth 2.2 | Stroke Color #Accent# | StrokeStartCap Round | StrokeEndCap Round
AntiAlias=1

; ===== Placeholder text =====
[MeterText]
Meter=String
Text=Type here to search
FontFace=Segoe UI Variable
FontSize=13
FontColor=#TextColor#
AntiAlias=1
X=52
Y=12
W=(#BarWidth#-70)
H=22
ClipString=1
LeftMouseUpAction=["shell:::{2559a1f8-21d7-11d4-bdaf-00c04f60b9f0}"]
ToolTipText=Abrir pesquisa do Windows

; Clique em qualquer zona abre a pesquisa
[MeterHitArea]
Meter=Image
SolidColor=0,0,0,1
W=#BarWidth#
H=#BarHeight#
X=0
Y=0
LeftMouseUpAction=["shell:::{2559a1f8-21d7-11d4-bdaf-00c04f60b9f0}"]
MouseOverAction=[!SetOption MeterBgFront Shape "Rectangle 0,0,#BarWidth#,#BarHeight#,22,22 | Fill Color 255,255,255,235 | StrokeWidth 1.2 | Stroke Color 255,255,255,255"][!UpdateMeter MeterBgFront][!Redraw]
MouseLeaveAction=[!SetOption MeterBgFront Shape "Rectangle 0,0,#BarWidth#,#BarHeight#,22,22 | Fill Color #BgColor# | StrokeWidth 1.2 | Stroke Color 255,255,255,230"][!UpdateMeter MeterBgFront][!Redraw]
